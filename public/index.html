<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers - Computer Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Customers</h1>
      <p>Customers collection table and total earnings.</p>
    </header>

    <div class="total total-top">
      Total earned: <strong id="total-earned-top">$0.00</strong>
    </div>

    <!-- Simple Form for Creating/Editing -->
    <section class="card" style="margin-bottom: 24px;">
      <h3 id="form-title" style="margin-bottom: 16px; font-size: 18px; font-weight: 600;">Add New Customer</h3>
      <form id="customer-form">
        <input type="hidden" id="cust-mongo-id" />
        <div class="grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin-bottom: 16px;">
          <label style="display: flex; flex-direction: column; font-size: 13px; font-weight: 500; gap: 6px;">
            Full Name
            <input type="text" id="cust-name" required placeholder="e.g. John Doe" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px;" />
          </label>
          <label style="display: flex; flex-direction: column; font-size: 13px; font-weight: 500; gap: 6px;">
            Email
            <input type="email" id="cust-email" required placeholder="e.g. john@example.com" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px;" />
          </label>
          <label style="display: flex; flex-direction: column; font-size: 13px; font-weight: 500; gap: 6px;">
            Type
            <select id="cust-type" required style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; background-color: #ffffff; cursor: pointer;">
              <option value="Normal">Normal</option>
              <option value="Frequent">Frequent</option>
              <option value="VIP">VIP</option>
            </select>
          </label>
          <label style="display: flex; flex-direction: column; font-size: 13px; font-weight: 500; gap: 6px;">
            Discount (%)
            <input type="number" id="cust-discount" min="0" max="100" placeholder="0" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px;" />
          </label>
          <label style="display: flex; flex-direction: column; font-size: 13px; font-weight: 500; gap: 6px;">
            Total Sale ($)
            <input type="number" id="cust-sale" min="0" step="0.01" placeholder="0.00" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px;" />
          </label>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button type="button" id="cancel-btn" style="background-color: #64748b; display: none;">Cancel</button>
          <button type="submit" id="submit-btn">Save Customer</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="table-header">
        <h2>Customer list</h2>
        <button id="refresh-btn" type="button">Refresh</button>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Full name</th>
              <th>Email</th>
              <th>Type</th>
              <th>Discount</th>
              <th>Total sale</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="customers-body"></tbody>
        </table>
      </div>
      <div class="total">
        Total earned: <strong id="total-earned">$0.00</strong>
      </div>
      <div id="form-status" class="status"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
